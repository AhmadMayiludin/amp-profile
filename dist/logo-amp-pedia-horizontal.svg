<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <title>AMP Pedia Agency - Kujang Emas Lockup</title>
  <defs>
    <linearGradient id="kujangGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="kujangBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221F1C"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Kujang Emas Pasundan -->
  <g transform="translate(40, 40) scale(0.46875)">
    <!-- Left Foundation Pillar -->
    <path d="M 236 64 L 64 440 H 138 L 196 308 H 272 L 244 244 H 224 L 256 168 L 236 64 Z" fill="url(#kujangBase)" />
    <!-- Right Kujang Dorsal Blade -->
    <path d="M 256 64 C 290 120 380 180 396 270 C 408 340 376 400 326 440 L 372 440 C 430 390 460 310 440 230 C 418 140 324 76 256 64 Z" fill="url(#kujangGold)" />
    <!-- Dorsal Siih 1 -->
    <path d="M 330 140 C 370 150 400 180 410 210 C 390 200 360 190 345 195 C 360 175 350 155 330 140 Z" fill="url(#kujangGold)" />
    <!-- Dorsal Siih 2 -->
    <path d="M 370 230 C 410 250 430 290 435 330 C 415 315 390 310 375 318 C 395 290 390 260 370 230 Z" fill="url(#kujangGold)" />
    <!-- Center Power Crossbar -->
    <path d="M 160 348 H 340 L 320 392 H 140 Z" fill="url(#kujangBase)" />
    <!-- 4 Mata Kujang -->
    <circle cx="270" cy="180" r="10" fill="#F59E0B" />
    <circle cx="295" cy="225" r="11" fill="#F59E0B" />
    <circle cx="318" cy="275" r="12" fill="#F59E0B" />
    <circle cx="335" cy="330" r="13" fill="#F59E0B" />
  </g>

  <!-- Typography Wordmark -->
  <g>
    <text x="320" y="148" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="68" font-weight="900" letter-spacing="-0.02em" fill="#1A1814">AMP <tspan font-weight="800" fill="#D97706">PEDIA</tspan> <tspan font-size="44" font-weight="800" fill="#B45309">• AGENCY</tspan></text>
    <text x="324" y="212" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#78716C">SOFTWARE HOUSE & DIGITAL STUDIO</text>
  </g>
</svg>
